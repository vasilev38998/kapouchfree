<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Vibe — социальная сеть</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#"><span class="brand-mark">✣</span><span>Vibe</span></a>
      <nav class="nav-list" id="mainNav">
        <button class="nav-item active" data-view="Главная">⌂ <span>Главная</span></button>
        <button class="nav-item" data-view="Лента">▤ <span>Лента</span></button>
        <button class="nav-item" data-view="Сообщества">♧ <span>Сообщества</span></button>
        <button class="nav-item" data-view="Уведомления">♢ <span>Уведомления</span><b>3</b></button>
        <button class="nav-item" data-view="Сообщения">◌ <span>Сообщения</span><b>2</b></button>
        <button class="nav-item" data-view="Сохранённое">⌑ <span>Сохранённое</span></button>
        <button class="nav-item" data-view="События">□ <span>События</span></button>
        <button class="nav-item" data-view="Настройки">⚙ <span>Настройки</span></button>
      </nav>
      <button class="primary-btn" id="openComposer">＋ Создать пост</button>
      <div class="profile-mini"><div class="avatar">ЕК</div><div><strong>Екатерина</strong><span>@kate_light</span></div><button>•••</button></div>
      <div class="progress-card"><strong>Ваш прогресс</strong><p>Заполните профиль на 80%</p><div><i></i></div></div>
      <button class="theme-toggle" id="themeToggle">☼ <span>Тёмная тема</span><i></i></button>
    </aside>

    <main class="main-column">
      <header class="topbar">
        <label class="search"><span>⌕</span><input id="searchInput" placeholder="Поиск людей, постов, сообществ..." /></label>
        <div class="top-actions"><button>▢</button><button>♢<i></i></button><div class="avatar small">ЕК</div></div>
      </header>

      <section class="stories-wrap">
        <div class="stories" id="stories"></div>
      </section>

      <section class="composer-card">
        <div class="avatar">ЕК</div>
        <button class="composer-placeholder" id="composerPlaceholder">Что у вас нового?</button>
        <div class="composer-actions"><button>▧ Фото</button><button>▣ Видео</button><button>♫ Музыка</button><button>☷ Опрос</button><button>⌖ Геолокация</button><button>☺</button></div>
      </section>

      <div class="feed-tabs"><button class="active">Для вас</button><button>Подписки</button><button>Популярное</button></div>
      <section class="feed" id="feed"></section>
    </main>

    <aside class="rightbar">
      <section class="side-card"><div class="section-head"><h3>События</h3><button>Показать все</button></div><div id="events"></div></section>
      <section class="side-card"><div class="section-head"><h3>Рекомендуемые люди</h3><button>Показать все</button></div><div id="people"></div></section>
      <section class="side-card"><div class="section-head"><h3>Популярные сообщества</h3><button>Показать все</button></div><div id="communities"></div></section>
      <section class="side-card"><div class="section-head"><h3>Тренды</h3><button>Показать все</button></div><div class="trends"><a>#летние_приключения <span>12.4K</span></a><a>#мотивация <span>8.7K</span></a><a>#фотодня <span>6.1K</span></a></div></section>
    </aside>
  </div>

  <nav class="mobile-nav"><button class="active">⌂<span>Главная</span></button><button>♧<span>Сообщества</span></button><button class="mobile-create" id="mobileCreate">＋</button><button>◌<span>Сообщения</span></button><button>♙<span>Профиль</span></button></nav>

  <dialog id="composerModal"><form id="postForm" method="dialog"><div class="modal-head"><h2>Новый пост</h2><button class="close" value="cancel">×</button></div><textarea name="text" maxlength="500" placeholder="Поделитесь мыслью..." required></textarea><input name="image" placeholder="Ссылка на изображение (необязательно)" /><div class="modal-actions"><span>Фото · Видео · Опрос</span><button class="primary-btn" value="default">Опубликовать</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
